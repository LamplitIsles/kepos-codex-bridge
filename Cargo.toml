[package]
name = "kepos-codex-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
nanocodex-oai-api = { git = "https://github.com/gakonst/nanocodex", rev = "7068272602508100b166715b4dfa68c3c36cdf22", version = "0.5.0" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tower = "0.5.2"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }
zstd = { version = "0.13.3", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 16

[workspace]
resolver = "2"
